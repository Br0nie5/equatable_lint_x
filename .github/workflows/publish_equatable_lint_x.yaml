name: Publish equatable_lint_x package to pub.dev

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+*" # tag pattern on pub.dev: 'v{{version}'
  workflow_dispatch: # allows manual trigger only

jobs:
  test:
    uses: ./.github/workflows/test_equatable_lint_x.yaml

  publish:
    name: "Publish to pub.dev"
    needs: test

    permissions:
      id-token: write

    runs-on: ubuntu-26.04-arm

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Read Flutter version from fvm
        id: fvm
        run: echo "flutter=$(jq -r '.flutter' .fvmrc)" >> "$GITHUB_OUTPUT"

      - name: Resolve matching Dart version
        id: dart
        run: |
          DART=$(curl -s https://storage.googleapis.com/flutter_infra_release/releases/releases_linux.json \
            | jq -r --arg v "${{ steps.fvm.outputs.flutter }}" \
              '[.releases[] | select(.version == $v)][0].dart_sdk_version' \
            | awk '{print $1}')
          echo "version=$DART" >> "$GITHUB_OUTPUT"

      - uses: dart-lang/setup-dart@v1.8.1
        with:
          sdk: ${{ steps.dart.outputs.version }}

      - name: Install Dependencies
        run: dart pub get

      - name: Publish to pub.dev
        run: dart pub publish -f
