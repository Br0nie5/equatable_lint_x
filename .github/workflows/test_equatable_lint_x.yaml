name: Test equatable_lint_x package

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "30 12 * * 0"
  workflow_call:

jobs:
  test:
    name: "Test equatable_lint_x"
    runs-on: ubuntu-26.04-arm

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Read Flutter version from fvm
        id: fvm
        run: echo "flutter=$(jq -r '.flutter' .fvmrc)" >> "$GITHUB_OUTPUT"

      - name: Resolve matching Dart version
        id: dart
        run: |
          DART=$(curl -s https://storage.googleapis.com/flutter_infra_release/releases/releases_linux.json \
            | jq -r --arg v "${{ steps.fvm.outputs.flutter }}" \
              '[.releases[] | select(.version == $v)][0].dart_sdk_version' \
            | awk '{print $1}')
          echo "version=$DART" >> "$GITHUB_OUTPUT"

      - uses: dart-lang/setup-dart@v1.8.1
        with:
          sdk: ${{ steps.dart.outputs.version }}

      - name: Install Dependencies
        run: dart pub get

      - name: Analyze
        run: dart analyze --fatal-infos lib test

      - name: Format
        run: dart format --set-exit-if-changed .

      - name: Install lcov
        run: |
          sudo apt-get update
          sudo apt-get install -y lcov

      - name: Test
        run: scripts/test.sh --coverage --ci

      - name: Vulnerabilities scan
        uses: google/osv-scanner-action/osv-scanner-action@v2.6.0
        with:
          scan-args: |-
            --lockfile=pubspec.lock

      - name: Activate pana pub package to compute package score
        run: dart pub global activate pana

      # It will always need a threshold of 10 since analyser is always
      # ahead of flutter in terms of versions.
      # So we lose points because we are not compatible with the latest
      # versions.
      - name: Check package score
        run: pana --exit-code-threshold=10
